<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>交易页面演示</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            padding-bottom: 70px;
        }
        .content-box{
            padding:20px;
        }
        .info-item{
            margin:10px 0;
            font-size:16px;
        }
        .record-title{
            margin-top:15px;
            font-weight:bold;
        }
        .record-item{
            font-size:15px;
            color:#333;
            margin:4px 0;
        }
        .login-area{
            margin:20px 0;
        }
        input{
            padding:6px;
            margin:5px;
            width:180px;
        }
        button{
            padding:6px 12px;
            cursor:pointer;
        }
        /* 联系按钮 */
        .contact-btn{
            display:block;
            width:90%;
            margin:10px auto;
            padding:10px;
            background:#2277ee;
            color:#fff;
            border:none;
            border-radius:6px;
        }
        /* 联系按钮原始容器 */
        .origin-contact-box{
            margin:20px 0;
        }
        /* 底部导航 */
        .bottom-nav{
            position:fixed;
            bottom:0;
            left:0;
            width:100%;
            height:60px;
            background:#fff;
            display:flex;
            justify-content: space-around;
            align-items:center;
            border-top:1px solid #ddd;
        }
    </style>
</head>
<body>
    <div class="content-box">
        <div class="info-item">总资产：<span id="asset-text">--</span></div>
        <div class="info-item">持仓：<span id="hold-text">--</span></div>

        <!-- 资金缴纳记录区域 -->
        <div class="record-title">资金缴纳记录：</div>
        <div id="record-box">
            <div class="record-item">--</div>
        </div>

        <div class="login-area">
            <input type="text" id="accInput" placeholder="账号">
            <input type="password" id="pwdInput" placeholder="密码">
            <br>
            <button onclick="doLogin()">登录</button>
            <button onclick="doLogout()">退出登录</button>
        </div>

        <!-- 联系按钮原来存放位置 -->
        <div class="origin-contact-box">
            <button class="contact-btn">联系我们</button>
        </div>

        <!-- 下面是你原有图表、其他页面内容区域，原有内容放这里，不会改动 -->
        <div class="other-content">
            <p>【原有图表、按钮、链接区域，保持原样不动】</p>
        </div>
    </div>

    <!-- 底部导航栏 -->
    <div class="bottom-nav">
        <span>首页</span>
        <span>行情</span>
        <span>持仓</span>
        <span>我的</span>
    </div>

<script>
// 账号配置
const accountList = [
    {
        account: "6671885463",
        pwd: "base123456",
        asset: "-75000比索",
        holdNum: "847股",
        payRecords: [
            {date:"2026.10.2", amount:"2200usdt"},
            {date:"2026.10.2", amount:"3888usdt"}
        ],
        specialBtnPos: true
    }
];

let loginAccountInfo = null;
const recordBox = document.getElementById("record-box");

function doLogin(){
    const accVal = document.getElementById("accInput").value.trim();
    const pwdVal = document.getElementById("pwdInput").value.trim();
    const findAcc = accountList.find(item => item.account === accVal && item.pwd === pwdVal);
    if(findAcc){
        loginAccountInfo = findAcc;
        document.getElementById("asset-text").innerText = findAcc.asset;
        document.getElementById("hold-text").innerText = findAcc.holdNum;
        // 渲染资金记录
        recordBox.innerHTML = "";
        findAcc.payRecords.forEach(r=>{
            recordBox.innerHTML += `<div class="record-item">${r.date} 缴纳 ${r.amount}</div>`;
        })
        alert("登录成功");
        if(findAcc.specialBtnPos){
            moveContactBtnToBottomNavUp();
        }
    }else{
        alert("账号或密码错误");
    }
}

function doLogout(){
    loginAccountInfo = null;
    document.getElementById("asset-text").innerText = "--";
    document.getElementById("hold-text").innerText = "--";
    recordBox.innerHTML = `<div class="record-item">--</div>`;
    resetContactBtnPos();
    alert("已退出登录");
}

// 登录账号：联系按钮移到底部导航上方
function moveContactBtnToBottomNavUp(){
    const contactBtn = document.querySelector(".contact-btn");
    const bottomNav = document.querySelector(".bottom-nav");
    if(contactBtn && bottomNav){
        bottomNav.parentNode.insertBefore(contactBtn, bottomNav);
    }
}

// 退出登录：按钮回到原来容器
function resetContactBtnPos(){
    const contactBtn = document.querySelector(".contact-btn");
    const originBox = document.querySelector(".origin-contact-box");
    if(contactBtn && originBox){
        originBox.appendChild(contactBtn);
    }
}
</script>
</body>
</html>
