<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basemaxpro</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #fff;
        }
        header {
            background: #1e293b;
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo {
            font-size: 20px;
            font-weight: bold;
            color: #ffc107;
        }
        .menu-btn {
            background: #ffc107;
            color: #000;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
        }
        .container {
            padding: 20px;
        }
        .card {
            background: #1e293b;
            border-radius: 12px;
            padding: 18px;
            margin-bottom: 16px;
        }
        .balance-text {
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 6px;
        }
        .balance-num {
            font-size: 28px;
            color: #ffc107;
            font-weight: bold;
        }
        .action-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top:16px;
        }
        .action-btn {
            padding:12px;
            border-radius:8px;
            border:none;
            font-size:15px;
            cursor:pointer;
        }
        .btn-deposit {
            background:#ffc107;
            color:#000;
        }
        .btn-withdraw {
            background:#334155;
            color:#fff;
        }
        .more-services-title {
            font-size:17px;
            margin:24px 0 12px;
        }
        .services-list {
            background:#1e293b;
            border-radius:12px;
            overflow:hidden;
        }
        .service-item {
            padding:16px 20px;
            border-bottom:1px solid #334155;
            cursor:pointer;
            display:flex;
            justify-content:space-between;
            align-items:center;
        }
        .service-item:last-child{
            border-bottom:none;
        }
        .service-item:hover{
            background:#334155;
        }
        .modal-mask {
            position:fixed;
            top:0;
            left:0;
            width:100%;
            height:100%;
            background:rgba(0,0,0,0.7);
            display:none;
            align-items:center;
            justify-content:center;
            z-index:999;
        }
        .modal-box {
            width:90%;
            max-width:420px;
            background:#1e293b;
            border-radius:12px;
            padding:20px;
        }
        .modal-header {
            display:flex;
            justify-content:space-between;
            align-items:center;
            margin-bottom:16px;
            padding-bottom:12px;
            border-bottom:1px solid #334155;
        }
        .modal-title {
            font-size:18px;
            color:#ffc107;
        }
        .close-modal {
            background:none;
            border:none;
            color:#fff;
            font-size:22px;
            cursor:pointer;
        }
        .empty-tip {
            text-align:center;
            padding:40px 0;
            color:#94a3b8;
        }
        .record-item {
            padding:12px 0;
            border-bottom:1px solid #334155;
        }
        .bottom-nav {
            position:fixed;
            bottom:0;
            left:0;
            width:100%;
            background:#1e293b;
            display:flex;
            padding:10px 0;
        }
        .nav-item {
            flex:1;
            text-align:center;
            font-size:13px;
            color:#94a3b8;
        }
        .nav-item.active {
            color:#ffc107;
        }
        .space-bottom {
            height:70px;
        }
    </style>
</head>
<body>
<header>
    <div class="logo">Basemaxpro</div>
    <button class="menu-btn">Menu</button>
</header>
<div class="container">
    <div class="card">
        <div class="balance-text">Saldo disponible</div>
        <div class="balance-num">USD 0.00</div>
        <div class="action-row">
            <button class="action-btn btn-deposit">Depositar</button>
            <button class="action-btn btn-withdraw">Retirar</button>
        </div>
    </div>

    <div class="more-services-title">Más servicios</div>
    <div class="services-list">
        <div class="service-item" onclick="openModal('fundRecord')">
            <span>Registro de fondos</span>
            <span>></span>
        </div>
        <!-- 新增 IPO缴纳记录 入口 -->
        <div class="service-item" onclick="openModal('ipoRecord')">
            <span>IPO缴纳记录</span>
            <span>></span>
        </div>
        <div class="service-item" onclick="openModal('tradeRecord')">
            <span>Registro de operaciones</span>
            <span>></span>
        </div>
    </div>

    <div class="space-bottom"></div>
</div>

<!-- IPO缴纳记录弹窗 -->
<div class="modal-mask" id="ipoModal">
    <div class="modal-box">
        <div class="modal-header">
            <div class="modal-title">IPO缴纳记录</div>
            <button class="close-modal" onclick="closeModal('ipoModal')">×</button>
        </div>
        <div id="ipoContent">
            <div class="empty-tip">暂无IPO缴纳记录</div>
        </div>
    </div>
</div>

<!-- 其他原有弹窗占位 -->
<div class="modal-mask" id="fundModal">
    <div class="modal-box">
        <div class="modal-header">
            <div class="modal-title">Registro de fondos</div>
            <button class="close-modal" onclick="closeModal('fundModal')">×</button>
        </div>
        <div class="empty-tip">Sin registros</div>
    </div>
</div>
<div class="modal-mask" id="tradeModal">
    <div class="modal-box">
        <div class="modal-header">
            <div class="modal-title">Registro de operaciones</div>
            <button class="close-modal" onclick="closeModal('tradeModal')">×</button>
        </div>
        <div class="empty-tip">Sin registros</div>
    </div>
</div>

<div class="bottom-nav">
    <div class="nav-item active">Inicio</div>
    <div class="nav-item">Mercado</div>
    <div class="nav-item">Activos</div>
    <div class="nav-item">Perfil</div>
</div>

<script>
// 模拟IPO数据，后续在这里加记录
const ipoRecords = [];

function openModal(type){
    if(type === 'ipoRecord'){
        const modal = document.getElementById('ipoModal');
        const contentWrap = document.getElementById('ipoContent');
        if(ipoRecords.length === 0){
            contentWrap.innerHTML = `<div class="empty-tip">暂无IPO缴纳记录</div>`;
        }else{
            let html = '';
            ipoRecords.forEach(item=>{
                html += `
                <div class="record-item">
                    <div>${item.name}</div>
                    <div style="color:#ffc107">${item.amount}</div>
                    <div style="font-size:13px;color:#94a3b8">${item.date}</div>
                </div>
                `
            })
            contentWrap.innerHTML = html;
        }
        modal.style.display = 'flex';
    }else if(type === 'fundRecord'){
        document.getElementById('fundModal').style.display = 'flex';
    }else if(type === 'tradeRecord'){
        document.getElementById('tradeModal').style.display = 'flex';
    }
}

function closeModal(id){
    document.getElementById(id).style.display = 'none';
}
// 点击遮罩关闭弹窗
document.querySelectorAll('.modal-mask').forEach(mask=>{
    mask.addEventListener('click',function(e){
        if(e.target === this){
            this.style.display = 'none';
        }
    })
})
</script>
</body>
</html>
