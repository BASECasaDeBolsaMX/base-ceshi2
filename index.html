<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="BASEMAXPRO - Gestión Patrimonial y administración profesional de patrimonio." />
  <title>BASEMAXPRO | Gestión Patrimonial</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --navy: #080d18;
      --navy-light: #101a2d;
      --gold: #d4af37;
      --gold-light: #f3d675;
      --gold-dark: #9d7b19;
      --blue: #2563eb;
      --white: #ffffff;
      --gray: #94a3b8;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: var(--navy);
      color: #fff;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .page {
      min-height: 100vh;
      display: flex;
      position: relative;
    }

    .brand-panel {
      width: 52%;
      min-height: 100vh;
      background:
        radial-gradient(circle at 20% 15%, rgba(212,175,55,.10), transparent 30%),
        radial-gradient(circle at 85% 80%, rgba(37,99,235,.12), transparent 32%),
        linear-gradient(135deg,#060a13 0%,#0c1425 52%,#080e1b 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 60px;
      position: relative;
      overflow: hidden;
    }

    .brand-panel::before {
      content: "";
      position: absolute;
      width: 600px;
      height: 600px;
      border: 1px solid rgba(212,175,55,.07);
      border-radius: 50%;
      top: -280px;
      left: -250px;
    }

    .brand-panel::after {
      content: "";
      position: absolute;
      width: 760px;
      height: 760px;
      border: 1px solid rgba(255,255,255,.035);
      border-radius: 50%;
      right: -380px;
      bottom: -380px;
    }

    .brand-content {
      width: 100%;
      max-width: 620px;
      position: relative;
      z-index: 2;
    }

    .premium-logo {
      width: 112px;
      height: 112px;
      position: relative;
      margin-bottom: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-diamond {
      position: absolute;
      width: 82px;
      height: 82px;
      transform: rotate(45deg);
      border: 1px solid rgba(212,175,55,.72);
      box-shadow: 0 0 18px rgba(212,175,55,.08), inset 0 0 18px rgba(212,175,55,.03);
    }

    .logo-diamond-inner {
      position: absolute;
      width: 62px;
      height: 62px;
      transform: rotate(45deg);
      border: 1px solid rgba(243,214,117,.45);
    }

    .base-monogram {
      position: relative;
      z-index: 3;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 47px;
      line-height: 1;
      font-weight: 700;
      letter-spacing: -5px;
      color: var(--gold-light);
      text-shadow: 0 0 8px rgba(212,175,55,.25), 0 2px 10px rgba(0,0,0,.55);
      transform: scaleX(.95);
    }

    .base-monogram::after {
      content: "";
      position: absolute;
      width: 48px;
      height: 1px;
      background: linear-gradient(90deg,transparent,var(--gold),transparent);
      left: 4px;
      bottom: -11px;
    }

    .logo-corner {
      position: absolute;
      width: 7px;
      height: 7px;
      border-color: var(--gold);
      border-style: solid;
      opacity: .85;
    }

    .logo-corner.tl { top:11px; left:11px; border-width:1px 0 0 1px; }
    .logo-corner.tr { top:11px; right:11px; border-width:1px 1px 0 0; }
    .logo-corner.bl { bottom:11px; left:11px; border-width:0 0 1px 1px; }
    .logo-corner.br { bottom:11px; right:11px; border-width:0 1px 1px 0; }

    .brand-logo {
      font-size: clamp(46px,7vw,88px);
      font-weight: 900;
      letter-spacing: -5px;
      line-height: .95;
      color: #fff;
      margin-bottom: 22px;
    }

    .brand-logo span { color: var(--gold-light); }

    .brand-line {
      width: 92px;
      height: 3px;
      background: linear-gradient(90deg,var(--gold-dark),var(--gold-light),transparent);
      border-radius: 20px;
      margin-bottom: 28px;
    }

    .brand-subtitle {
      font-size: 16px;
      color: var(--gold-light);
      letter-spacing: 5px;
      text-transform: uppercase;
      margin-bottom: 32px;
      font-weight: 500;
    }

    .brand-description {
      max-width: 520px;
      font-size: 16px;
      line-height: 1.85;
      color: #cbd5e1;
    }

    .login-panel {
      width: 48%;
      min-height: 100vh;
      background: #f8fafc;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px;
      color: #0f172a;
    }

    .login-card {
      width: 100%;
      max-width: 430px;
    }

    .login-header { margin-bottom: 34px; }

    .login-header h1 {
      font-size: 34px;
      font-weight: 800;
      color: #0f172a;
      margin-bottom: 10px;
    }

    .login-header p {
      color: #64748b;
      font-size: 15px;
      line-height: 1.6;
    }

    .form-group { margin-bottom: 20px; }

    .form-label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: 700;
      color: #334155;
    }

    .input-wrapper { position: relative; }

    .form-input {
      width: 100%;
      height: 54px;
      border: 1px solid #cbd5e1;
      border-radius: 12px;
      padding: 0 16px;
      font-size: 15px;
      outline: none;
      background: #fff;
      color: #0f172a;
      transition: all .2s ease;
    }

    .form-input::placeholder { color: #94a3b8; }

    .form-input:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 4px rgba(59,130,246,.10);
    }

    .form-input.input-error {
      border-color: #ef4444;
      box-shadow: 0 0 0 3px rgba(239,68,68,.08);
    }

    .password-input { padding-right: 54px; }

    .toggle-password {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      border: none;
      background: transparent;
      cursor: pointer;
      color: #64748b;
      font-size: 18px;
      width: 32px;
      height: 32px;
      border-radius: 8px;
    }

    .toggle-password:hover { background: #f1f5f9; color: #334155; }

    .forgot-row {
      display: flex;
      justify-content: flex-end;
      margin-top: -8px;
      margin-bottom: 22px;
    }

    .forgot-password {
      border: none;
      background: transparent;
      color: #2563eb;
      font-size: 14px;
      cursor: pointer;
      font-weight: 600;
    }

    .forgot-password:hover { text-decoration: underline; }

    .login-button {
      width: 100%;
      height: 56px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg,#2563eb,#1d4ed8);
      color: #fff;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      transition: all .2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .login-button:hover {
      transform: translateY(-1px);
      box-shadow: 0 10px 24px rgba(37,99,235,.25);
    }

    .login-button:active { transform: translateY(0); }
    .login-button.loading { cursor: wait; opacity: .85; }
    .login-button:disabled { cursor: wait; }

    .spinner {
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255,255,255,.35);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .8s linear infinite;
      display: none;
    }

    .login-button.loading .spinner { display: block; }
    .login-button.loading .button-text { display: none; }

    @keyframes spin { to { transform: rotate(360deg); } }

    .login-footer {
      text-align: center;
      margin-top: 24px;
      color: #94a3b8;
      font-size: 12px;
      line-height: 1.6;
    }

    .contact-buttons {
      position: fixed;
      right: 22px;
      bottom: 22px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      z-index: 9999;
      transition: bottom .25s ease;
    }

    body.dashboard-active .contact-buttons {
      bottom: 85px;
    }
        .contact-button {
      width: 58px;
      height: 58px;
      border-radius: 50%;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      text-decoration: none;
      box-shadow: 0 8px 24px rgba(0,0,0,.25);
      transition: transform .2s ease, box-shadow .2s ease;
    }

    .contact-button:hover {
      transform: translateY(-3px) scale(1.04);
      box-shadow: 0 12px 30px rgba(0,0,0,.30);
    }

    .contact-button:focus-visible {
      outline: 3px solid rgba(37,99,235,.45);
      outline-offset: 3px;
    }

    .contact-button svg { width:29px; height:29px; fill:#fff; }

    .cnbv-button {
      background: linear-gradient(145deg,#f2f4f7,#d7dce3);
      border: 2px solid rgba(255,255,255,.9);
    }

    .cnbv-logo {

      height:40px;

      width:31px;

      display:flex;

      position:relative;
    }

    .cnbv-emblem::after {

    }

    .binance-button {
      background:linear-gradient(145deg,#f8d33a,#f0b90b);
      color:#111;
    }

    .binance-logo {
      width:32px;
      height:32px;
      position:relative;
      display:flex;
      align-items:center;
      justify-content:center;
    }

    .binance-diamond {
      position:absolute;
      width:9px;
      height:9px;
      background:#111;
      transform:rotate(45deg);
    }

    .binance-diamond.top { top:1px; }
    .binance-diamond.left { left:1px; }
    .binance-diamond.right { right:1px; }
    .binance-diamond.bottom { bottom:1px; }
    .binance-diamond.center { width:8px; height:8px; }

    .nasdaq-button {
      background:linear-gradient(145deg,#fff 0%,#e7edf5 48%,#cbd5e1 100%);
    }

    .nasdaq-logo {
      width:47px;
      height:40px;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      position:relative;
    }

    .nasdaq-mark {
      position:relative;
      width:31px;
      height:19px;
      margin-bottom:2px;
    }

    .nasdaq-mark span {
      position:absolute;
      bottom:0;
      width:4px;
      border-radius:3px 3px 1px 1px;
      background:linear-gradient(180deg,#0072ce,#003b73);

    .nasdaq-mark .bar1 { height:9px; left:1px; }

    .nasdaq-mark .bar5 { height:9px; left:25px; }

    .nasdaq-word {
      font-family:Arial,Helvetica,sans-serif;
      font-size:7px;
      font-weight:900;
      letter-spacing:1px;
      color:#123c68;
      line-height:1;
    }

    .tradingview-button {
      background:linear-gradient(145deg,#1f2937 0%,#111827 55%,#030712 100%);
      border:2px solid rgba(255,255,255,.18);
    }

    .tradingview-logo {
      width:48px;
      height:42px;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      position:relative;
    }

    .tv-chart {
      width:35px;
      height:22px;
      position:relative;
      margin-bottom:1px;
    }

    .tv-chart::before {
      content:"";
      position:absolute;
      left:1px;
      bottom:3px;
      width:29px;
      height:13px;
      border-left:3px solid #42a5ff;
      border-bottom:3px solid #42a5ff;
      transform:skewY(-24deg) rotate(-1deg);
    }

    .tv-chart::after {
      content:"";
      position:absolute;
      left:9px;
      top:5px;
      width:20px;
      height:10px;
      border-top:3px solid #7dc4ff;
      border-right:3px solid #7dc4ff;
      transform:skewY(-27deg) rotate(-8deg);
    }

    .tv-word {
      font-family:Arial,Helvetica,sans-serif;
      font-size:6px;
      font-weight:900;
      letter-spacing:.7px;
      color:#fff;
      line-height:1;
    }

    .telegram-button { background:#229ed9; }
    .email-button { background:#2563eb; }
    .whatsapp-button { background:#25d366; }

    .toast {
      position:fixed;
      left:50%;
      bottom:32px;
      transform:translateX(-50%) translateY(30px);
      min-width:300px;
      max-width:calc(100vw - 40px);
      background:rgba(15,23,42,.96);
      color:#fff;
      padding:16px 20px;
      border-radius:12px;
      box-shadow:0 12px 35px rgba(0,0,0,.30);
      opacity:0;
      pointer-events:none;
      transition:all .3s ease;
      z-index:10000;
      text-align:center;
    }

    .toast.show {
      opacity:1;
      transform:translateX(-50%) translateY(0);
    }

    .toast-title {
      font-size:14px;
      font-weight:800;
      margin-bottom:4px;
    }

    .toast-message {
      font-size:13px;
      color:#cbd5e1;

    }
